[global]

workgroup = WORKGROUP
server string = Samba Server Version %v

netbios name = HOMENAS
;	interfaces = lo eth0 192.168.12.2/24 192.168.13.2/24
hosts allow = 127. 192.168.1. 10.10.0. 10.20.0 10.1.0.

# log files split per-machine:
log file = /var/log/samba/log.%m
# maximum size of 50KB per log file, then rotate:
max log size = 50
security = user
passdb backend = tdbsam
local master = yes
os level = 33
preferred master = yes

load printers = no
cups options = raw

vfs objects = fruit streams_xattr
fruit:metadata = stream
fruit:model = MacSamba
fruit:veto_appledouble = no
fruit:nfs_aces = no
fruit:wipe_intentionally_left_blank_rfork = yes
fruit:delete_empty_adfiles = yes
fruit:posix_rename = yes
fruit:zero_file_id = yes
fruit:wipe_intentionally_left_blank_rfork = yes
fruit:delete_empty_adfiles = yes

server signing = disabled
smb encrypt = disabled
ea support = yes

# Protocol floor/ceiling — SMB3 onl
server min protocol = SMB3_00
server max protocol = SMB3_11
client min protocol = SMB3

# Multichannel
server multi channel support = yes

# Async I/O and sendfile
aio read size = 1
aio write size = 1
use sendfile = yes

# Socket tuning for 1Gb+ links
socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072

# Larger read/write raw
read raw = yes
write raw = yes

strict locking = no
oplocks = yes
level2 oplocks = yes
#============================ Share Definitions ==============================

[Shared]
comment = Homelab Shared
path = /mnt/pool0/Shared
guest ok = no
writeable = yes
public = no
valid users = shareaccess
browseable = yes

[PlexMedia]
comment = Homelab PlexMedia
path = /mnt/pool0/PlexMedia
guest ok = no
writeable = yes
public = no
valid users = shareaccess
browseable = yes

